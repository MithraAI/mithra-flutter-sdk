name: mithra_flutter_sdk
description: >-
  Mithra's Narya SDK for Flutter. A thin bridge over the Narya native SDKs for
  analytics, push notifications, in-app messages and the mobile inbox.
# Pre-publication baseline, matching `.release-please-manifest.json`. Nothing is
# published as 0.0.0: release-please computes the real version from the
# Conventional Commit history and rewrites this line, CHANGELOG.md, the podspec
# and android/build.gradle together in the release PR. Keeping this in step with
# the manifest is also what keeps `dart pub publish --dry-run` green, because it
# warns (and exits 65) when CHANGELOG.md has no section for the version declared
# here.
version: 1.0.3
homepage: https://mithra.com
repository: https://github.com/MithraAI/mithra-flutter-sdk
issue_tracker: https://github.com/MithraAI/mithra-flutter-sdk/issues
documentation: https://github.com/MithraAI/mithra-flutter-sdk#readme

# pub.dev search topics (lowercase, hyphenated, max 5).
topics:
  - analytics
  - push-notifications
  - notifications
  - in-app-messaging
  - marketing

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.mithra.flutter.sdk
        pluginClass: MithraFlutterSdkPlugin
      ios:
        pluginClass: MithraFlutterSdkPlugin
